name: Deploy to Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
      CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp project
        run: |
          if [ -z "${CLASP_SCRIPT_ID}" ]; then
            echo "Missing CLASP_SCRIPT_ID secret" >&2
            exit 1
          fi
          cp .clasp.json.template .clasp.json
          sed -i "s/InsertScriptIdHere/${CLASP_SCRIPT_ID}/" .clasp.json

      - name: Authenticate with Google Apps Script
        run: |
          if [ -z "${GOOGLE_CREDENTIALS}" ]; then
            echo "Missing GOOGLE_CREDENTIALS secret" >&2
            exit 1
          fi
          echo "${GOOGLE_CREDENTIALS}" > creds.json
          clasp login --creds creds.json
          rm -f creds.json

      - name: Push project
        run: clasp push --force

      - name: Create version
        run: clasp version "${GITHUB_REF_NAME}@${GITHUB_SHA}"

      - name: Update deployment
        if: env.CLASP_DEPLOYMENT_ID != ''
        run: clasp deploy --deploymentId "${CLASP_DEPLOYMENT_ID}" --description "${GITHUB_REF_NAME}@${GITHUB_SHA}"
